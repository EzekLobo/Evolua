name: Evolua Web
on:
  push:
    paths: ['web/**', 'package*.json', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'package*.json', '.github/workflows/web.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
